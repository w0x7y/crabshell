name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # dbus-daemon and /usr/share/zoneinfo are for the clock's tests
      - name: Install fontconfig, fonts, dbus and tzdata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev fonts-dejavu-core fonts-noto-color-emoji dbus tzdata
      - name: Install libpulse for audio, libxkbcommon for the keyboard and libpam for passwords
        run: sudo apt-get install -y --no-install-recommends libpulse-dev libxkbcommon-dev libpam0g-dev
      # Ubuntu builds DejaVu itself, with other underline metrics than the
      # official 2.37 release the goldens were drawn with, so that replaces it
      - name: Install the DejaVu release the goldens were drawn with
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip
          echo "7576310b219e04159d35ff61dd4a4ec4cdba4f35c00e002a136f00e96a908b0a  dejavu-fonts-ttf-2.37.zip" | sha256sum -c
          unzip -q dejavu-fonts-ttf-2.37.zip
          sudo cp dejavu-fonts-ttf-2.37/ttf/DejaVuSans*.ttf /usr/share/fonts/truetype/dejavu/
      # Ubuntu's Noto Sans is older than the one the goldens were drawn with and
      # it has no Znamenny, so both come from the notofonts commit Gentoo packages
      - name: Install the Noto fonts the goldens were drawn with
        run: |
          mkdir -p ~/.local/share/fonts ~/.config/fontconfig
          cd ~/.local/share/fonts
          base=https://raw.githubusercontent.com/notofonts/notofonts.github.io/025970232f4f8ff349310d9785431e87d20ed27c/fonts
          curl -fsSLO "$base/NotoSans/hinted/ttf/NotoSans-Regular.ttf"
          curl -fsSLO "$base/NotoSans/hinted/ttf/NotoSans-Bold.ttf"
          curl -fsSLO "$base/NotoSans/hinted/ttf/NotoSans-Italic.ttf"
          curl -fsSLO "$base/NotoSans/hinted/ttf/NotoSans-BoldItalic.ttf"
          curl -fsSLO "$base/NotoZnamennyMusicalNotation/hinted/ttf/NotoZnamennyMusicalNotation-Regular.ttf"
          sha256sum -c <<'EOF'
          478c558ea716033cd60c03438f628dfa75694dcf6b5f6d505a2f05fd2b4f3823  NotoSans-Regular.ttf
          1df075a380fc7cb898acf64c1f7b3b4dd780de3caa860178bf929de35817a913  NotoSans-Bold.ttf
          467e3f89eeca4108bb8710a2b9e0cf2281ac56d5b0609211a83776d0505eecb5  NotoSans-Italic.ttf
          1b602a9d6353be42c91df097a4857b69fa2696f26703d7a33b54a15d87c2622c  NotoSans-BoldItalic.ttf
          b6ed2a11d2a653e14137a35e4c6fdaf5093434ac12964791ee195270828e7508  NotoZnamennyMusicalNotation-Regular.ttf
          EOF
          cat > ~/.config/fontconfig/fonts.conf <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias>
              <family>sans-serif</family>
              <prefer><family>Noto Sans</family></prefer>
            </alias>
          </fontconfig>
          EOF
          fc-cache -f
          fc-match sans-serif
      - name: Check dependency licenses and advisories against deny.toml
        run: |
          cargo install --locked cargo-deny@0.20.2
          cargo deny check licenses advisories
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # A golden that doesn't match leaves the picture it drew here
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: target/golden-failures
          if-no-files-found: ignore
