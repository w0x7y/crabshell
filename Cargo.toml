[workspace]
resolver = "3"
members = [
    "spike",
    "crates/crabshell-reactive",
    "crates/crabshell-ui",
    "crates/crabshell-render",
    "crates/crabshell-wayland",
    "crates/crabshell-services",
    "crates/crabshell",
    "crates/crabshell-cli",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/w0x7y/crabshell"
readme = "README.md"
keywords = ["wayland", "desktop-shell", "status-bar", "sway", "quickshell"]
categories = ["gui", "os::linux-apis"]

# Every external crate is pinned to one exact version here ("=x.y.z").
# Member crates refer to them with `name.workspace = true`.
[workspace.dependencies]
calloop = { version = "=0.14.5", features = ["executor", "signals"] }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
fontconfig = "=0.11.0"
# Only the system time zone and /usr/share/zoneinfo, no bundled tzdb.
jiff = { version = "=0.2.42", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Minimal features: what the audio service calls is in every libpulse since 5.0.
libpulse-binding = { version = "=2.30.1", default-features = false }
# PAM's client side, for lock screens. It links the system's libpam and
# needs no bindgen.
nonstick = "=0.1.2"
png = "=0.18.1"
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
image-webp = "=0.2.4"
resvg = { version = "=0.49.0", default-features = false }
# Without tokio, which only its stream API needs.
inotify = { version = "=0.11.5", default-features = false }
# The version calloop uses. "process" has pidfd_open, for the supervisor.
rustix = { version = "=1.1.6", default-features = false, features = ["event", "fs", "net", "process", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Signal handlers that only write to a pipe, so a shell can stop its
# programs on SIGTERM without blocking it for the programs it starts.
signal-hook = { version = "=0.4.6", default-features = false }
slotmap = "=1.1.1"
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
taffy = { version = "=0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
unicode-segmentation = "=1.13.3"
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
# The version sctk 0.21.1 uses, so there is one copy. "staging" has
# wp_fractional_scale_v1.
wayland-protocols = { version = "=0.32.13", default-features = false, features = ["client", "staging", "unstable"] }
# The version sctk 0.21.1 uses. For wlr-foreign-toplevel-management.
wayland-protocols-wlr = { version = "=0.3.12", default-features = false, features = ["client"] }
# Generates the bindings for the Hyprland protocols in
# crates/crabshell-wayland/protocols, as wayland-protocols does. The
# version wayland-client uses.
wayland-scanner = "=0.31.11"
# The fake compositor crabshell-wayland's protocol tests run against. The
# version that matches wayland-client's backend.
wayland-server = "=0.31.14"
zbus = { version = "=6.2.1", default-features = false, features = ["default-rt", "proxy"] }

# The workspace's own crates.
crabshell-reactive = { version = "=0.5.0", path = "crates/crabshell-reactive" }
crabshell-render = { version = "=0.5.0", path = "crates/crabshell-render" }
crabshell-services = { version = "=0.5.0", path = "crates/crabshell-services" }
crabshell-ui = { version = "=0.5.0", path = "crates/crabshell-ui" }
crabshell-wayland = { version = "=0.5.0", path = "crates/crabshell-wayland" }
