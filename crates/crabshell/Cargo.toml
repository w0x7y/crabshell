[package]
name = "crabshell"
version.workspace = true
description = "A full Rust replacement for Quickshell, where your whole shell is a Rust crate"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# For the supervisor's control socket on the loop.
calloop.workspace = true
crabshell-reactive.workspace = true
# `cx.quantize_colors` decodes images as `Image` does.
crabshell-render.workspace = true
crabshell-services.workspace = true
crabshell-ui.workspace = true
crabshell-wayland.workspace = true
# Re-exported: `cx.clock()` hands out a `jiff::Zoned`.
jiff.workspace = true
# `cx.persist` values, saved as JSON across a reload.
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
tracing.workspace = true
# Writes the shell's logs to stderr.
tracing-subscriber.workspace = true

[dev-dependencies]
# A headless test checks that a bundled font's face came from its bytes.
cosmic-text.workspace = true
# The headless Sway tests decode grim's screenshots and write goldens.
png.workspace = true
# The headless Sway tests' virtual pointer.
smithay-client-toolkit.workspace = true
# The fake compositor in crabshell-wayland's tests/fake, with the server
# side of the protocols it offers.
wayland-protocols = { workspace = true, features = ["server"] }
wayland-protocols-wlr = { workspace = true, features = ["server"] }
wayland-server.workspace = true
# The fake logind the lock example sleeps with.
zbus.workspace = true
