[package]
name = "crabshell-wayland"
version.workspace = true
description = "Crabshell's Wayland platform: the event loop, layer-shell and floating windows, popups, input, outputs and the session lock"
edition.workspace = true
rust-version.workspace = true
# It ships Hyprland's protocol XML, and code generated from it, under BSD-3.
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
calloop.workspace = true
# For the runtime the loop flushes.
crabshell-reactive.workspace = true
crabshell-render.workspace = true
crabshell-ui.workspace = true
# Punching out a spare buffer's memory.
rustix.workspace = true
smithay-client-toolkit.workspace = true
tracing.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
wayland-scanner.workspace = true

[dev-dependencies]
# The headless Sway tests decode grim's screenshots.
png.workspace = true
# To capture log lines in tests.
tracing-subscriber.workspace = true
# The fake compositor in tests/fake, with the server side of the
# protocols it offers.
wayland-protocols = { workspace = true, features = ["server"] }
wayland-protocols-wlr = { workspace = true, features = ["server"] }
wayland-server.workspace = true
