[package]
name = "crabshell-cli"
# 0.2.1 fixes `init --path`; the other crates stay at the workspace's 0.2.0.
version = "0.2.1"
description = "The crabshell command: creates, checks, runs and calls into a Crabshell config"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "crabshell"
path = "src/main.rs"
# Named like the crabshell library, so its docs would overwrite the library's.
doc = false

[dependencies]
calloop.workspace = true
inotify.workspace = true
rustix.workspace = true
serde_json.workspace = true
zbus.workspace = true

[dev-dependencies]
# The exit check's headless Sway, through crabshell-wayland's test helper.
crabshell-wayland.workspace = true
png.workspace = true
smithay-client-toolkit.workspace = true
