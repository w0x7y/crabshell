[package]
name = "crabshell-services"
# 0.2.1 reaches polkit's helper through its socket; the rest stay at 0.2.0.
version = "0.2.1"
description = "Crabshell's services: workspaces, tray, audio, clock, power, Bluetooth, network, media players, notifications, apps, programs, files, PAM, greetd and polkit"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
calloop.workspace = true
crabshell-reactive.workspace = true
crabshell-ui.workspace = true
inotify.workspace = true
jiff.workspace = true
libpulse-binding.workspace = true
# Authenticating a lock screen's user, through the system's libpam.
nonstick.workspace = true
# pidfd_open and kill, to follow, stop and reap the programs a config runs,
# opening a file without waiting on a pipe, and telling a socket client that
# stopped sending from one that hung up.
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
zbus.workspace = true

[dev-dependencies]
# The Sway tests' private headless Sway, through crabshell-wayland's test
# helper.
crabshell-wayland.workspace = true
png.workspace = true
smithay-client-toolkit.workspace = true
# Only to capture log lines in tests.
tracing-subscriber.workspace = true
