# A PipeWire daemon for the private-server tests: two null sinks
# and a null source, no D-Bus, no devices and no realtime. Their ports
# are set up here and `link-factory` lets a test link them, as a session
# manager would.
context.properties = { support.dbus = false core.daemon = true core.name = pipewire-0 log.level = 1 }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-access }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-metadata }
  { name = libpipewire-module-spa-node-factory }
  { name = libpipewire-module-link-factory }
]
context.objects = [
  # With no session manager, this is what makes test-sink the default.
  { factory = metadata args = {
      metadata.name = default
      metadata.values = [
        { key = default.audio.sink value = { name = test-sink } }
        { key = default.audio.source value = { name = test-source } }
      ]
  } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = "test-sink" media.class = Audio/Sink audio.position = [ FL FR ] object.linger = true adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = "other-sink" node.description = "Other Sink" media.class = Audio/Sink audio.position = [ FL FR ] object.linger = true adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = "test-source" node.description = "Test Source" media.class = Audio/Source/Virtual audio.position = [ FL FR ] object.linger = true adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
]
